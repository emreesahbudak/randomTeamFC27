services:
  postgres:
    image: postgres:16-alpine
    container_name: fc27-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fc27
      POSTGRES_USER: fc27
      POSTGRES_PASSWORD: fc27_dev_pw
    ports:
      # Host port 5433 (not the default 5432) so this matches whichever Postgres backend/
      # application.yaml expects regardless of whether it's this container or a native
      # local install providing it — see the port note in application.yaml.
      - "5433:5432"
    volumes:
      - fc27-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fc27 -d fc27"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fc27-postgres-data:
