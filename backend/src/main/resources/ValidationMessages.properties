# Overrides Hibernate Validator's default (English) messages for the standard Bean
# Validation annotations used across every request DTO — one place to keep every
# validation error the user could see in Turkish, instead of a message="..." on each
# annotation everywhere it's used.
jakarta.validation.constraints.NotBlank.message=Boş bırakılamaz
jakarta.validation.constraints.NotNull.message=Bu alan zorunlu
jakarta.validation.constraints.Email.message=Geçerli bir e-posta adresi olmalı
jakarta.validation.constraints.Pattern.message=Geçersiz format
jakarta.validation.constraints.Min.message=En az {value} olmalı
jakarta.validation.constraints.Max.message=En fazla {value} olmalı
jakarta.validation.constraints.Size.message={min} ile {max} karakter arasında olmalı
